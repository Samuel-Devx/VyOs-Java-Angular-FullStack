<div class="flex justify-start items-center gap-3 w-full">
  <p-card class="w-100 ml-10 mr-10" header="{{ name() }}" subheader="{{ number() }}"
    [style]="{ 'border-radius': '10px' }">
    <ng-template #title>
      <div class="flex items-center gap-3">
        <p-avatar [label]="initials()" shape="circle"
          styleClass="!bg-violet-100 !text-violet-700 font-semibold dark:!bg-violet-500/20 dark:!text-violet-300"
          size="large" />
        <span><strong>{{ name() }}</strong></span>
        <span class="px-2 py-1 text-xs font-medium rounded-full" [class]="statusClasses()">
          {{ status() }}
        </span>
      </div>
    </ng-template>

    <p class="m-0 text-sm text-surface-600 dark:text-surface-300">
      {{ email() }}
    </p>
    <p-divider align="left" class="!my-4  !mb-0"> </p-divider>
    <ng-template #footer>
      <div class="flex items-center justify-end !mt-0">
        <button type="button" (click)="edit.emit()"
          class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-lg px-3 text-sm font-medium bg-violet-50 text-violet-700 dark:bg-violet-500/10 dark:text-violet-300 transition-colors hover:bg-violet-100 dark:hover:bg-violet-500/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400">
          <i class="pi pi-pencil text-xs" aria-hidden="true"></i>
          Editar
        </button>
        <button type="button"
          class="group relative flex items-center justify-center h-10 w-10 rounded-xl bg-red-500 hover:bg-primary-emphasis text-primary-contrast hover:shadow-xl hover:shadow-primary-500/40 hover:scale-105 active:scale-95 transition-all duration-200 m-3 cursor-pointer"
          (click)="confirmDelete($event)">
          <svg data-p-icon="trash" class="h-4 w-4 text-white transition-transform duration-200" />
        </button>
      </div>
    </ng-template>
  </p-card>
</div>

<p-toast />
<p-confirmpopup />

<p-toolbar>
  <ng-template #start>
    <button type="button" (click)="sidebarService.open()"
      class="flex items-center justify-center h-8 w-8 rounded-md bg-primary hover:bg-primary-emphasis text-primary-contrast hover:shadow-xl hover:shadow-primary-500/40 hover:scale-105 active:scale-95 transition-all duration-200 m-3 cursor-pointer">
      <svg data-p-icon="bars" class="h-4 w-4" />
    </button>
  </ng-template>

  <ng-template #center>
    <p-iconfield iconPosition="left">
      <p-inputicon class="pi pi-search" />
      <input type="text" pInputText placeholder="Search" />
    </p-iconfield>
  </ng-template>

  <ng-template #end>
    <button pButton severity="primary" size="small" (click)="openCreate()">
      <i class="pi pi-plus"></i>
      <span>Novo Cliente</span>
    </button>
  </ng-template>
</p-toolbar>

<app-client-dialog [(visible)]="showCreateDialog" [mode]="dialogMode" [client]="selectedClient"
  (save)="onSaveClient($event)"></app-client-dialog>

@if (loading()) {
<p class="mt-3">Carregando clientes...</p>
} @else if (clients().length === 0) {
<div class="flex flex-col items-center justify-center text-center gap-3 py-16 mt-3">
  <i class="pi pi-users text-5xl text-surface-400"></i>
  <h3 class="text-xl font-semibold m-0">Nenhum contato ainda</h3>
  <p class="text-surface-500 m-0">
    Você ainda não cadastrou nenhum contato. Comece adicionando o primeiro.
  </p>
  <button pButton severity="primary" (click)="openCreate()">
    <i class="pi pi-plus"></i>
    <span>Criar primeiro contato</span>
  </button>
</div>
} @else {
<div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-3 mt-3 gap-x-0">
  @for (client of clients(); track client.id) {
  <app-client-card [id]="client.id" [name]="client.name" [number]="client.phoneNumber" [email]="client.email"
    [status]="client.stats" (edit)="openEdit(client)" (deleted)="onDeleted($event)" />
  }
</div>
}

<div class="flex justify-start items-center gap-2">
  <p-drawer #drawerRef [(visible)]="sidebarService.visible">
    <ng-template #headless>
      <div class="flex flex-col h-full">
        <div class="flex items-center justify-between px-5 pt-3 shrink-0">
          <span class="inline-flex items-center gap-2">
            <img src="logo.png" alt="VyCode" class="h-8 w-8" />
            <span class="font-semibold text-xl text-primary">VyOs</span>
          </span>
          <span>
            <button type="button" pButton iconOnly (click)="closeCallback($event)" rounded="true" outlined="true"
              class="h-8 w-8">
              <svg data-p-icon="times" />
            </button>
          </span>
        </div>
        <div class="overflow-y-auto">
          <ul class="list-none p-3 m-0">
            <li>
              <app-hide-divider label="Clientes" pStyleClass="@next" enterFromClass="hidden"
                enterActiveClass="animate-slidedown" leaveToClass="hidden" leaveActiveClass="animate-slideup"
                class="p-3 flex items-center justify-between text-surface-600 dark:text-surface-200 cursor-pointer p-ripple">
              </app-hide-divider>
              <ul class="list-none p-0 m-0 overflow-hidden">
                <app-option icon="home" label="Dashboard" route="/dashboard"></app-option>
                <app-option icon="briefcase" label="CRM" route="/crm"></app-option>
                <app-option icon="file-edit" label="Contratos" route="/contratos"></app-option>
                <app-option icon="send" label="Propostas" route="/propostas"></app-option>
              </ul>


              <app-hide-divider label="VyCode" pStyleClass="@next" enterFromClass="hidden"
                enterActiveClass="animate-slidedown" leaveToClass="hidden" leaveActiveClass="animate-slideup"
                class="p-3 flex items-center justify-between text-surface-600 dark:text-surface-200 cursor-pointer p-ripple">
              </app-hide-divider>
              <ul class="list-none p-0 m-0 overflow-hidden">
                <app-option icon="check-square" label="Tasks" route="/tasks"></app-option>
                <app-option icon="folder" label="Projects" route="/projects"></app-option>
                <app-option icon="cog" label="Settings" route="/settings"></app-option>
              </ul>
            </li>
          </ul>
        </div>
        <div class="mt-auto">
          <hr class="mb-3 mx-3 border-t border-0 border-surface" />
          <a pRipple
            class="m-3 flex items-center cursor-pointer p-3 gap-2 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors p-ripple">
            <img src="perfil.png" alt="Samuka Dev" class="h-8 w-8 rounded-full" />
            <span class="font-bold text-sm">Samuka Dev</span>
          </a>
        </div>
      </div>
    </ng-template>
  </p-drawer>
</div>

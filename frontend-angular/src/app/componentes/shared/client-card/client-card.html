<div class="flex justify-start items-center gap-3 w-full">
  <p-card class="w-100 ml-10 mr-10" header="{{ name() }}" subheader="{{ number() }}"
    [style]="{ 'border-radius': '10px' }">
    <ng-template #title>
      <div class="flex items-center justify-between">
        <span><strong>{{ name() }}</strong></span>
        <span
          class="px-2 py-1 text-xs font-medium rounded-full"
          [class]="statusClasses()"
        >
          {{ status() }}
        </span>
      </div>
    </ng-template>

    <p class="m-0 text-sm text-surface-600 dark:text-surface-300">
      {{ email() }}
    </p>

    <ng-template #footer>

      <div class="flex items-center justify-end gap-1">
        <button type="button"
          class="group relative flex items-center  justify-center h-10 w-40 rounded-xl bg-surface-0 dark:bg-surface-900 ring-1 ring-surface-200 dark:ring-surface-700 hover:ring-2 hover:ring-primary-400 shadow-sm hover:shadow-md transition-all duration-200 m-3 cursor-pointer">
          Editar
        </button>
        <button type="button"
          class="group relative flex items-center justify-center h-10 w-10 rounded-xl bg-red-500 hover:bg-primary-emphasis text-primary-contrast hover:shadow-xl hover:shadow-primary-500/40 hover:scale-105 active:scale-95 transition-all duration-200 m-3 cursor-pointer">
          <svg data-p-icon="trash" class="h-4 w-4 text-white transition-transform duration-200" />
        </button>
      </div>
    </ng-template>
  </p-card>
</div>
